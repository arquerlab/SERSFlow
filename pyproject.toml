[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sersflow"
version = "0.1.0"
description = "SERSFlow: loaders and API for SERS/Raman datasets"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "fastapi",
  "uvicorn[standard]",
  "python-multipart",
  "pandas",
  "numpy",
  "scipy",
  "scikit-learn",
  "matplotlib",
  "renishawWiRE",
]

[project.optional-dependencies]
client = ["httpx>=0.27"]
parquet = ["pyarrow>=14"]
explore-fda = ["scikit-fda>=0.9"]

[project.scripts]
sersflow-api = "sersflow.api.main:run"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["sersflow*"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]

