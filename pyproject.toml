[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sersflow"
version = "0.2.0"
description = "SERSFlow: loaders and API for vibrational (SERS/Raman/FTIR) and XPS datasets"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "fastapi",
  "uvicorn[standard]",
  "python-multipart",
  "pandas",
  "numpy",
  "scipy",
  "scikit-learn",
  "matplotlib",
  "renishawWiRE",
  "bcrypt",
  "pybaselines",
  "lmfitxps>=4.2.0",
  "h5py>=3.8",
]

[project.optional-dependencies]
client = ["httpx>=0.27"]
mcp = [
  "mcp>=1.18.0,<2",
  "httpx>=0.27",
  "tomli>=2; python_version < '3.11'",
]
parquet = ["pyarrow>=14"]
explore-fda = ["scikit-fda>=0.9"]

[project.scripts]
sersflow-api = "sersflow.api.main:run"
sersflow-mcp = "sersflow.mcp.__main__:main"
sersflow-admin = "sersflow.cli.admin:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["sersflow*"]

[tool.setuptools.package-data]
sersflow = ["core/xps/data/*.json"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "auth: tests that exercise real authentication (not AUTH_DISABLED)",
]

